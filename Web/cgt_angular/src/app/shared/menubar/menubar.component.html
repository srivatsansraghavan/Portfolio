<nav class="navbar">
  <a class="navbar-brand" href="http://srivatsanssr.up.railway.app/index.html"
    >Portfolio Home</a
  >
  @if(isLoggedIn) {
  <button
    class="navbar-brand"
    (click)="openProfileModal(profileModal)"
  >
    {{ loggedInUser }}
  </button>
    <button class="navbar-brand" (click)="doLogout()">
    Logout
  </button>
  } @else {
    <button
      class="navbar-brand"
      (click)="openLoginModal(loginModal)"
    >
      Caregiver Tracker
    </button>
  }

  <a class="navbar-brand" href="#">Environment: {{ envName }}</a>

</nav>

<ng-template #signupModal>
 <app-signup (closeModal)="modal.dismissAll()" (openLogin)="openLoginModal(loginModal)"></app-signup>
</ng-template>

<ng-template #loginModal>
  <app-login (closeModal)="modal.dismissAll()" (openSignUp)="openSignupModal(signupModal)"></app-login>
</ng-template>

<ng-template #profileModal>
  <div class="modal-header">
    <h3 class="modal-title centre">Signup</h3>
  </div>
  <div class="modal-body"></div>
</ng-template>
