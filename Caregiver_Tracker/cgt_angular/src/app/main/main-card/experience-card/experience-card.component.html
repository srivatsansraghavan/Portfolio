<div class="experience-card">
    @if(showHeader) {
        <div class="experience-header" (click)="showDetail()" (keydown)="showDetail()" (keyup.enter)="showDetail()" role="button" tabindex="0">
            <h3>{{ employer }}</h3>
            <h4> {{ designation }}  </h4>
            <h4> {{ dateEmployed}} </h4>
        </div>
    }
</div>
